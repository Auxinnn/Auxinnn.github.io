<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA球队韧性指标排行榜</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🏀 NBA球队韧性指标排行榜</h1>
            <p class="subtitle">Team Resilience Rankings</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="seasonSelect">选择赛季:</label>
                <select id="seasonSelect">
                    <option value="2024-25">2024-25赛季</option>
                    <option value="2023-24" selected>2023-24赛季</option>
                    <option value="2022-23">2022-23赛季</option>
                    <option value="2021-22">2021-22赛季</option>
                    <option value="2020-21">2020-21赛季</option>
                </select>
            </div>
            <button id="refreshBtn" class="refresh-btn">🔄 刷新数据</button>
        </div>

        <div id="loadingIndicator" class="loading">
            <div class="spinner"></div>
            <p>加载中...</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <div class="stats-cards">
            <div class="stat-card">
                <div class="stat-value" id="totalTeams">-</div>
                <div class="stat-label">参与球队</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgScore">-</div>
                <div class="stat-label">平均韧性分</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="updateTime">-</div>
                <div class="stat-label">更新时间</div>
            </div>
        </div>

        <div class="table-container">
            <table id="rankingTable">
                <thead>
                    <tr>
                        <th class="rank-col">排名</th>
                        <th class="team-col">球队</th>
                        <th class="score-col">韧性得分</th>
                        <th class="actions-col">操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- 数据将通过JavaScript填充 -->
                </tbody>
            </table>
        </div>

        <div id="detailModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="modalTeamName">球队详情</h2>
                <div class="detail-content">
                    <div class="detail-section">
                        <h3>逆境表现维度</h3>
                        <div class="indicators" id="adversityIndicators"></div>
                    </div>
                    <div class="detail-section">
                        <h3>连续性与稳定性维度</h3>
                        <div class="indicators" id="consistencyIndicators"></div>
                    </div>
                    <div class="detail-section">
                        <h3>阵容适应性维度</h3>
                        <div class="indicators" id="lineupIndicators"></div>
                    </div>
                    <div class="detail-section">
                        <h3>心理韧性维度</h3>
                        <div class="indicators" id="mentalIndicators"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
